<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#151411">
<title>The Story of Cinema — A Timeline of Change</title>
<style>
  :root{
    --ink:#171612; --paper:#eeeae1; --muted:#aaa69c; --accent:#d8ff3e;
    --serif: "Bodoni 72", "Didot", "Bodoni MT", "Times New Roman", serif;
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--ink);color:var(--paper);font-family:var(--sans)}
  body{overflow:hidden}
  button,a{-webkit-tap-highlight-color:transparent}
  button{font:inherit}
  .view{position:fixed;inset:0;visibility:hidden;opacity:0;pointer-events:none;transition:opacity .7s ease,visibility .7s}
  .view.is-active{visibility:visible;opacity:1;pointer-events:auto}
  /* PAGE 1 — circular word map */
  #intro{display:grid;place-items:center;overflow:hidden;background:
    radial-gradient(ellipse at 50% 48%,rgba(105,103,84,.15),transparent 44%),
    #171612}
  .intro-top{position:absolute;top:30px;left:34px;right:34px;display:flex;justify-content:space-between;align-items:center;
    color:#c8c3b8;font-size:10px;letter-spacing:.2em;text-transform:uppercase}
  .intro-top .issue{opacity:.65}
  .orbit-stage{position:relative;width:min(76vw,76vh,720px);aspect-ratio:1;display:grid;place-items:center}
  .orbit-stage:before,.orbit-stage:after{content:"";position:absolute;border:1px solid rgba(238,234,225,.13);border-radius:50%;inset:9%}
  .orbit-stage:after{inset:18%;border-color:rgba(238,234,225,.08)}
  .orbit-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;animation:orbit 75s linear infinite}
  .orbit-svg text{fill:#e6e1d6;font-family:var(--sans);font-size:12px;letter-spacing:4px;text-transform:uppercase}
  .orbit-svg .wordline{opacity:.95}
  .centerpiece{position:relative;z-index:2;text-align:center;display:flex;flex-direction:column;align-items:center;gap:20px}
  .eyebrow{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#aaa69c}
  .centerpiece h1{font-family:var(--serif);font-weight:400;font-size:clamp(42px,7vw,86px);line-height:.84;letter-spacing:-.055em;margin:0}
  .centerpiece h1 span{display:block;font-style:italic;font-size:.82em;margin-top:9px}
  .enter-btn{border:1px solid rgba(238,234,225,.52);background:transparent;color:var(--paper);padding:13px 24px;border-radius:999px;letter-spacing:.16em;text-transform:uppercase;font-size:10px;cursor:pointer;transition:background .25s,color .25s,border-color .25s,transform .25s}
  .enter-btn:hover{background:var(--accent);color:var(--ink);border-color:var(--accent);transform:translateY(-2px)}
  .intro-bottom{position:absolute;bottom:28px;left:34px;right:34px;display:flex;justify-content:space-between;align-items:end;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#aaa69c}
  .intro-bottom .scroll-note{display:flex;align-items:center;gap:12px}
  .tiny-line{height:1px;width:34px;background:var(--accent)}
  @keyframes orbit{to{transform:rotate(360deg)}}
  /* PAGE 2 — four-part image grid */
  #chapters{background:#111;overflow:hidden}
  .chapter-grid{height:100%;width:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;background:#111}
  .chapter{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;text-decoration:none;color:#f1eee7;isolation:isolate;min-height:0}
  .chapter::before{content:"";position:absolute;inset:0;background-image:var(--bg);background-position:center;background-size:cover;z-index:-2;transform:scale(1.02);transition:transform 1.15s cubic-bezier(.2,.7,.15,1),filter .8s ease;filter:brightness(.55) saturate(.75)}
  .chapter::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,0,0,.3),transparent 50%,rgba(0,0,0,.38));z-index:-1;transition:background .6s ease}
  .chapter:hover::before,.chapter:focus-visible::before{transform:scale(1.12);filter:brightness(.78) saturate(.95)}
  .chapter:hover::after{background:rgba(0,0,0,.08)}
  .chapter-label{position:relative;display:flex;align-items:baseline;gap:.22em;font-family:var(--serif);font-weight:400;font-size:clamp(44px,7.8vw,124px);line-height:.8;letter-spacing:-.065em;text-shadow:0 2px 35px rgba(0,0,0,.22);transition:transform .7s cubic-bezier(.2,.7,.15,1)}
  .chapter:hover .chapter-label{transform:translateY(-4px)}
  .chapter-label .italic{font-style:italic}
  .chapter-label .small{font-size:.68em}
  .made-by{position:absolute;z-index:6;right:24px;bottom:14px;font-size:9px;letter-spacing:.16em;color:rgba(255,255,255,.78);text-transform:uppercase;pointer-events:none}
  .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  @media (max-width:700px){
    .intro-top{top:20px;left:18px;right:18px}.intro-top .issue{display:none}
    .orbit-stage{width:min(92vw,70vh)}
    .orbit-svg text{font-size:13px;letter-spacing:2.5px}
    .intro-bottom{left:18px;right:18px;bottom:18px}.intro-bottom .right-note{display:none}
    .chapter-grid{grid-template-columns:1fr;grid-template-rows:repeat(4,1fr)}
    .chapter-label{font-size:clamp(42px,12vw,74px)}
    .made-by{right:14px;bottom:10px}
  }
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
  <main>
    <section class="view is-active" id="intro" aria-label="Opening page">
      <div class="intro-top"><span>Film / Media / Change</span><span class="issue">A visual research project · 01—03</span></div>
      <div class="orbit-stage">
        <svg class="orbit-svg" viewBox="0 0 700 700" role="img" aria-label="A rotating circle of cinema-related words">
          <defs><path id="circlePath" d="M350,350 m-252,0 a252,252 0 1,1 504,0 a252,252 0 1,1 -504,0"/></defs>
          <text class="wordline"><textPath id="orbitWords" href="#circlePath" startOffset="0%">CINEMA · FILM · SHOT · FRAME · MONTAGE · SPECTACLE · NARRATIVE · PROJECTION · CELLULOID · PIXEL · RENDER · REALISM · SIMULATION · CHRONOPHOTOGRAPHY · SPECTATOR · APPARATUS · EDITING · CINEMATOGRAPHY · </textPath></text>
        </svg>
        <div class="centerpiece">
          <div class="eyebrow">A history of moving images</div>
          <h1>The Story<span>of Cinema</span></h1>
          <button class="enter-btn" id="enterBtn" type="button">Enter <span aria-hidden="true">↗</span></button>
        </div>
      </div>
      <div class="intro-bottom"><div class="scroll-note"><span class="tiny-line"></span><span>Look closer at the moving image</span></div><span class="right-note">From apparatus to algorithm</span></div>
    </section>

    <section class="view" id="chapters" aria-label="Choose a chapter">
      <div class="chapter-grid">
        <a class="chapter" href="page3.html#the" target="_blank" rel="noopener" style="--bg:url('https://raw.githubusercontent.com/ahaSammy/my-web-demo/main/%E5%BD%B1%E5%8E%85.jpeg')" aria-label="Open the chapter page">
          <span class="chapter-label"><span class="small">the</span></span>
        </a>
        <a class="chapter" href="page3.html#story" target="_blank" rel="noopener" style="--bg:url('https://raw.githubusercontent.com/ahaSammy/my-web-demo/main/%E6%B5%B7%E6%8A%A5%E9%9B%86%E5%90%88.jpeg')" aria-label="Open the story chapter page">
          <span class="chapter-label"><span class="italic">Story</span></span>
        </a>
        <a class="chapter" href="page3.html#of" target="_blank" rel="noopener" style="--bg:url('https://raw.githubusercontent.com/ahaSammy/my-web-demo/main/%E8%A7%82%E4%BC%97%E5%B8%AD.jpeg')" aria-label="Open the of chapter page">
          <span class="chapter-label"><span class="small">of</span></span>
        </a>
        <a class="chapter" href="page3.html#cinema" target="_blank" rel="noopener" style="--bg:url('https://raw.githubusercontent.com/ahaSammy/my-web-demo/main/%E5%85%83%E7%B4%A0%E9%9B%86%E5%90%88.jpeg')" aria-label="Open the cinema chapter page">
          <span class="chapter-label"><span class="italic">Cinema</span></span>
        </a>
      </div>
      <div class="made-by">Made by Sammy</div>
    </section>
  </main>
<script>
(() => {
  const intro = document.getElementById('intro');
  const chapters = document.getElementById('chapters');
  const enterBtn = document.getElementById('enterBtn');
  const words = document.getElementById('orbitWords');

  // Populate the circular text from the supplied cinema vocabulary list.
  const cinemaWords = [
    'cinema','film','shot','frame','pan','tilt','zoom','fade','cut','montage',
    'mise-en-scène','composition','cinematography','editing','spectator','screen',
    'projection','medium','apparatus','indexicality','simulacrum','spectacle',
    'narrative','diegesis','celluloid','aperture','shutter','exposure','take',
    'auteur','distribution','exhibition','pipeline','realism','simulation','depth',
    'focus','sequence','persistence','chronophotography','render','pixel','rendering',
    'track','dolly','crane','filter','grain','contrast','hue','texture','dialogue',
    'soundtrack','sync','genre','pace','rhythm','vignette','negative','positive',
    'reel','lens','iris','mask','flashback','foreshadowing'
  ];
  words.textContent = (cinemaWords.join('   ·   ') + '   ·   ').repeat(2);

  function showChapters(){
    intro.classList.remove('is-active');
    chapters.classList.add('is-active');
    document.body.style.background = '#111';
    history.replaceState(null, '', '#chapters');
  }
  enterBtn.addEventListener('click', showChapters);
})();
</script>
</body>
</html>
